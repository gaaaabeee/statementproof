[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "statementproof"
version = "0.1.0"
description = "Parse bank statement PDFs into transaction data that reconciles against the statements' own printed totals."
readme = "README.md"
requires-python = ">=3.9"
license = {file = "LICENSE"}
keywords = ["banking", "statements", "pdf", "personal-finance", "reconciliation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Topic :: Office/Business :: Financial :: Accounting",
]

# One dependency, deliberately. Anyone running this points it at their entire
# financial history; every added package is supply-chain risk on that data.
dependencies = ["pypdf>=6.0"]

[project.scripts]
statementproof = "statementproof.run:main"
statementproof-dashboard = "statementproof.dashboard:main"
statementproof-app = "statementproof.app:main"

[tool.setuptools]
packages = ["statementproof"]
