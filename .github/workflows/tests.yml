name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest discover -s tests -v

      # eval_set.jsonl is only ever committed after every case is verified
      # against actual output (see statementproof/eval.py), so it should
      # always score 100% -- a drop here means merchants.py regressed against
      # its own previously-proven behavior, not that the fixture is stale.
      - name: Categorization eval
        run: python -m statementproof.eval --min-accuracy 1.0 --min-coverage 1.0 -v

      # The tests must not depend on a developer's personal rules file, and
      # must not read one if it happens to exist on the runner.
      - name: Tests are hermetic
        run: python -m unittest discover -s tests
        env:
          HOME: ${{ runner.temp }}

  no-secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Guard against the one mistake that cannot be undone once pushed:
      # committing a statement, a rules file, or generated financial output.
      - name: No financial data committed
        run: |
          set -e
          bad=$(git ls-files | grep -Ei \
            '\.pdf$|(^|/)out(-[^/]*)?/|statements?/|(^|/)(transactions|by_category)\.csv$|(^|/)dashboard\.html$' \
            || true)
          if [ -n "$bad" ]; then
            echo "::error::financial data is tracked by git:"; echo "$bad"; exit 1
          fi
          rules=$(git ls-files | grep -E '(^|/)rules\.json$' | grep -v '^tests/fixtures/' || true)
          if [ -n "$rules" ]; then
            echo "::error::a personal rules file is tracked:"; echo "$rules"; exit 1
          fi

          # The checks above trust the filename. A statement committed as
          # "fixture.txt" or "sample.bin" passes all of them, so identify PDFs
          # by their magic bytes instead -- the one property a rename cannot
          # change. No PDF belongs in this repo under any name.
          pdfs=""
          while IFS= read -r f; do
            [ -f "$f" ] || continue
            case "$(head -c 5 -- "$f" 2>/dev/null)" in
              %PDF*) pdfs="$pdfs$f"$'\n' ;;
            esac
          done < <(git ls-files)
          if [ -n "$pdfs" ]; then
            echo "::error::a PDF is tracked under a non-.pdf name:"; echo "$pdfs"; exit 1
          fi
          echo "clean: no statements, no output, no personal rules, no disguised PDFs"
